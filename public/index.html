<!doctype html>
<html>

<head>
  <title>Socket.IO chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font: 13px Helvetica, Arial;
    }

    form {
      background: #000;
      padding: 3px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    form input {
      border: 0;
      padding: 10px;
      width: 90%;
      margin-right: .5%;
    }

    form button {
      width: 9%;
      background: rgb(130, 224, 255);
      border: none;
      padding: 10px;
    }

    #messages {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    #messages li {
      padding: 5px 10px;
    }

    #messages li:nth-child(odd) {
      background: #eee;
    }

    #messages {
      margin-bottom: 40px
    }
  </style>
</head>

<body>
  <ul id="messages"></ul>
  <form action="">
    <input id="m" autocomplete="off" /><button>Send</button>
  </form>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.3.0/socket.io.dev.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
  <script>
    $(function () {
      $('form').submit(function () {
        socket.emit('chat-message', $('#m').val());
        $('#m').val('');
        return false;
      });
      fetch('login').then(response => response.json()).then(data => {
        var userid = data.user;//模拟一个userid
        var socket = io({ transports: ['websocket'] });
        console.log(socket.id);
        //socket.io系统消息
        socket.on('connect', () => {
          console.log(`connect to server with id ${socket.id} , send my user id 5001`);
          //socket.io 我们自定义消息, login
          socket.emit('login', userid)//login with my user_id
        });
        //刷新浏览器 socket.id会变，但不是reconnect消息
        //reconnect成功后会再触发connect消息
        socket.on('reconnect', (attemptNumber) => {
          let status = socket.connected ? "connect" : "disconnect"
          console.log(`attemptNumber ${attemptNumber} with id ${socket.id}, 
         current status ${status}`);
        });
        socket.on('disconnect', (reason) => {
          console.log(`disconnect reason ${reason}`)
        })
        //socket.io 我们自定义消息 ack
        socket.on('loginAck', (msg, fn) => {
          $('#messages').append($('<li>').text(msg));
          window.scrollTo(0, document.body.scrollHeight);
          // fn('loginACK reply')
        });
        socket.on('incoming_msg', (msg, fn) => {
          let m = "incoming message " + msg
          $('#messages').append($('<li>').text(m));
          window.scrollTo(0, document.body.scrollHeight);
          fn(`${msg} received`)
        });
      });
    });
  </script>
</body>

</html>

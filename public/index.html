<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Socket.IO chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font: 13px Helvetica, Arial;
    }

    form {
      background: #000;
      padding: 3px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    form input {
      border: 0;
      padding: 10px;
      width: 90%;
      margin-right: .5%;
    }

    form button {
      width: 9%;
      background: rgb(130, 224, 255);
      border: none;
      padding: 10px;
    }

    #messages {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    #messages li {
      padding: 5px 10px;
    }

    #messages li:nth-child(odd) {
      background: #eee;
    }

    #messages {
      margin-bottom: 40px
    }
  </style>
</head>

<body>
  <ul id="messages"></ul>
  <form action="">
    <input id="m" autocomplete="off" /><button>Send</button>
  </form>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.3.0/socket.io.dev.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
  <script src=https://cdnjs.cloudflare.com/ajax/libs/axios/0.19.2/axios.min.js></script>
  <!-- <script async src="//cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"
    onload="initFingerprintJS()"></script> -->
  <script>
    $(function () {
      fetch('login').then(response => response.json()).then(data => {
        console.log(`what is login response ${JSON.stringify(data)}`)
        let user_id = data.user;//模拟一个userid
        // use browser websocket, check readme #websocket client section
        // var ws = new WebSocket("ws://localhost:3000/socket.io/?EIO=3&transport=websocket");
        // // var ws = new WebSocket("ws://localhost:3000")
        // ws.onopen = function () {
        //   console.log('connect to ws server!!')
        //   // Web Socket is connected, send data using send()
        // };

        // ws.onmessage = function (evt) {
        //   var received_msg = evt.data;
        //   console.log(`Message is received...  ${received_msg}`);
        //   // if (received_msg == '40') ws.send('login');
        //   if (received_msg) ws.send('login');
        // };

        // ws.onclose = function () {
        //   // websocket is closed.
        //   console.log("Connection is closed...");
        // };

        // use socket.io client
        // let wsCB = undefined;
        let socket = io({ transports: ['websocket'] });
        console.log(socket.id);
        $('form').submit(function () {
          socket.emit('chat-message', $('#m').val());
          $('#m').val('');
          return false;
        });
        //socket.io系统消息
        socket.on('connect', () => {
          console.log(`connect to server with id ${socket.id} , send my user id 1001`);
          //socket.io 我们自定义消息, login
          socket.emit('login', {user_id,token:"fake"}, reply => {
            console.log(`只有收到服务器确认客户端才能确认login成功:${JSON.stringify(reply)}`)
            //这里只是一个简单示例，服务器返回userid,客户端作比较
            if (reply.user_id == 'login') {
              console.log('服务器成功处理login')
              // wsCB(reply)
            } else {
              console.log('服务器返回值不对!')
            }
          })//login with my user_id
        });
        //刷新浏览器 socket.id会变，但不是reconnect消息
        //reconnect成功后会再触发connect消息
      //   socket.on('reconnect', (attemptNumber) => {
      //     let status = socket.connected ? "connect" : "disconnect"
      //     console.log(`attemptNumber ${attemptNumber} with id ${socket.id}, 
      //    current status ${status}`);
      //   });
        socket.on('disconnect', (reason) => {
          console.log(`disconnect reason ${reason}`)
        })
        socket.on('cr_msg', (msg, fn) => {
          console.log(`收到服务器消息 ${msg}`)
          const data = JSON.parse(msg)
          let m = `超级企业 ${data.seid} 企业 ${data.ccgeid} 坐席${data.uid} 消息类型 ${data.op_code}
          具体数据 ${JSON.stringify(data.data)}`
          //data.data是需要具体分析
          $('#messages').append($('<li>').text(m));
        });
        //这个现在示例作用不大了，可以不用
        socket.on('incoming_msg', (msg, fn) => {
          let m = "incoming message " + msg
          $('#messages').append($('<li>').text(m));
          window.scrollTo(0, document.body.scrollHeight);
          fn(`${msg} received`)
        });
      });
    });

  </script>

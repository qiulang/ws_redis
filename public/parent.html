    <script>
      console.log("In parent, addEventListener");
      window.addEventListener(

      var iframeP = document.getElementById("myiframe");
      var iframeWin = iframeP.contentWindow;
      iframeP.onload = function () {
        //iframeWin.onload = function() {
        //console.log('iframeWin at onload?', iframeWin)
        iframeWin.postMessage("Hello from parent onload", "*");
        setTimeout(() => {
          iframeWin.postMessage("Hello from parent 2 seconds later", "*");
        }, 2000);
      };

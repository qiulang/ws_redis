server {
	#listen为nginx监听的端口号
    listen 10080;	
    root   /Users/qiulang/Dev/redis/public;
    index  index.html index.htm;

    location / {
        try_files $uri $uri/ @websocket;
    }

    location @websocket {
		#通过proxy_pass 定义需要转发的ip和port
        proxy_pass http://127.0.0.1:3000;

		#下面的两项是对socket转发的特殊配置（转发socket需要upgrade头）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
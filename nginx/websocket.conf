map $remote_addr $log_ip {
    "127.0.0.1" 0;
    default 1;
}

server {
	#listen为nginx监听的端口号
    listen 10080;	
    # server_name seat;
    # root   /Users/qiulang/Project/call_center/bs-front/dist;
    # index  index.html index.htm;
    # log 到底在哪个目录
    # access_log  logs/ql.access.log ;
    # error_log  logs/ql.error.log ;
    # Conditional logging has some problem
    # access_log if=$log_ip;
    # 在/usr/local/Cellar/nginx/1.15.8/logs
    access_log logs/ql.access.log combined if=$log_ip;

    location /socket.io {
        try_files $uri $uri/ @websocket;
    }

    location / {
        # sed -i.bak "s#base:.*http.*#base: \'${REST_SERVER}\'#g" index.html
        root   /Users/qiulang/Project/call_center/bs-front/dist;
        index  index.html index.htm;
        try_files $uri $uri/ @websocket;
    }

    location /rep {
        # 子路径用 alias不用root 但 "/" 如果用alias 要注意结尾必须有 /
        alias   /Users/qiulang/Project/call_center/bs-front/dist;
        index  index.html index.htm;
        # history mode, index.html is the fallback
        try_files $uri $uri/ /rep/index.html;
        # hash mode, @websocket is the fallback
        # try_files $uri $uri/ @websocket;
    }

    location @websocket {
		#通过proxy_pass 定义需要转发的ip和port
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
		#下面的两项是对socket转发的特殊配置（转发socket需要upgrade头）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # no need
        # proxy_set_header Host $host;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
